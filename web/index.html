<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图层合成绘画窗口</title>
<style>
  :root {
    --bg: #1e2127; --panel: #262a32; --panel2: #2f343e; --line: #3a404c;
    --text: #e6e8ec; --muted: #9aa3b2; --accent: #5b9dff; --err: #ff6b6b;
    --ok: #54d18c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; height: 100vh;
  }
  header {
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 280px 1fr 300px; min-height: 0; }
  .panel { background: var(--panel); overflow: auto; padding: 10px; }
  .panel + .panel { border-left: 1px solid var(--line); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 14px 0 6px; }
  h2:first-child { margin-top: 2px; }
  button, select, input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .row label { color: var(--muted); min-width: 64px; }
  input[type=range] { flex: 1; }
  .tree { list-style: none; margin: 0; padding: 0; }
  .tree ul { list-style: none; margin: 0; padding-left: 14px; }
  .node {
    padding: 5px 7px; border-radius: 6px; margin: 2px 0; cursor: pointer;
    display: flex; align-items: center; gap: 6px; border: 1px solid transparent;
  }
  .node:hover { background: var(--panel2); }
  .node.selected { border-color: var(--accent); background: rgba(91,157,255,.12); }
  .node .kind { font-size: 10px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; }
  .node .flags { margin-left: auto; display: flex; gap: 4px; font-size: 10px; color: var(--accent); }
  .canvas-wrap { display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 10px; min-width: 0; }
  .canvas-box { position: relative; image-rendering: pixelated; }
  canvas { image-rendering: pixelated; border: 1px solid var(--line); background:
    repeating-conic-gradient(#333842 0 25%, #2a2f38 0 50%) 0 0/16px 16px; }
  #probe { position: absolute; outline: 1px solid var(--accent); pointer-events: none; }
  #error-strip {
    display: none; background: rgba(255,107,107,.15); border-top: 1px solid var(--err);
    color: #ffc4c4; padding: 7px 14px; font-size: 12px;
  }
  #error-strip.show { display: block; }
  .swatch { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); padding: 0; }
  .stage {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; margin: 5px 0; font-variant-numeric: tabular-nums;
  }
  .stage .name { font-weight: 600; }
  .stage .meta { color: var(--muted); font-size: 11px; }
  .chip { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    border: 1px solid var(--line); vertical-align: middle; margin-right: 5px; }
  .muted { color: var(--muted); }
  .log { font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--muted);
    max-height: 160px; overflow: auto; white-space: pre-wrap; }
  input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line);
    background: var(--panel2); border-radius: 6px; }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; }
  .seg button.on { background: var(--accent); color: #0b1220; border-color: var(--accent); }
  .why-box {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; font-size: 11px; margin-top: 4px; max-height: 220px; overflow: auto;
  }
  .why-box .reason { border-left: 2px solid var(--accent); padding: 4px 7px; margin: 4px 0; }
  .why-box .cause { color: var(--accent); font-weight: 600; }
  .why-box .path { color: var(--muted); font-family: ui-monospace, monospace; }
  .why-box .none { color: var(--ok); }
  .cost-box {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; font-size: 11px; font-variant-numeric: tabular-nums;
  }
  .cost-box .warn { color: var(--err); font-weight: 600; }
  .cost-box .ok { color: var(--ok); }
  .pill { display:inline-block; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:1px 7px; margin:1px 3px 1px 0; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>图层合成绘画窗口</h1>
  <span class="muted" id="canvas-size"></span>
  <div class="spacer"></div>
  <div class="seg" id="backend-seg">
    <button data-backend="ref" class="on">CPU 参考</button>
    <button data-backend="acc">加速</button>
  </div>
  <button id="btn-eval" class="primary">求值合成</button>
  <button id="btn-save">保存工程</button>
  <button id="btn-export">导出 PNG</button>
  <button id="btn-reset" class="danger">重置示例</button>
</header>

<main>
  <!-- ============== left: layers ============== -->
  <section class="panel">
    <h2>图层 / 组（底部先画）</h2>
    <div class="row">
      <button id="btn-add-layer">+ 图层</button>
      <button id="btn-add-group">+ 组</button>
      <button id="btn-delete" class="danger">删除</button>
    </div>
    <ul class="tree" id="tree"></ul>

    <h2>选中节点</h2>
    <div id="inspector">
      <div class="row"><label>名称</label><input type="text" id="f-name" style="flex:1"></div>
      <div class="row"><label>不透明度</label>
        <input type="range" id="f-opacity" min="0" max="1" step="0.01">
        <span id="f-opacity-val" style="width:42px" class="muted"></span>
      </div>
      <div class="row"><label>混合模式</label><select id="f-blend"></select></div>
      <div class="row" id="iso-row"><label>隔离组</label>
        <div class="seg" style="flex:1">
          <button id="f-iso-on">隔离</button>
          <button id="f-iso-off">穿透</button>
        </div>
      </div>
      <div class="row"><label>裁切到下层</label>
        <div class="seg" style="flex:1">
          <button id="f-clip-on">裁切</button>
          <button id="f-clip-off">正常</button>
        </div>
      </div>
      <div class="row">
        <button id="btn-why" style="flex:1">为何重画（反查缓存依赖）</button>
      </div>
      <div id="why-box" class="why-box" style="display:none"></div>
    </div>

    <h2>画笔（真实软笔迹）</h2>
    <div class="row"><label>颜色</label><input type="color" id="brush-color" value="#d22828"></div>
    <div class="row"><label>不透明度</label>
      <input type="range" id="brush-alpha" min="1" max="255" value="140">
      <span id="brush-alpha-val" style="width:42px" class="muted"></span>
    </div>
    <div class="row"><label>半径</label>
      <input type="range" id="brush-radius" min="1" max="12" step="0.5" value="4">
      <span id="brush-radius-val" style="width:42px" class="muted"></span>
    </div>
    <div class="row"><label>硬度</label>
      <input type="range" id="brush-hardness" min="0" max="1" step="0.05" value="0.4">
      <span id="brush-hardness-val" style="width:42px" class="muted"></span>
    </div>
    <div class="row"><label>绘画目标</label>
      <div class="seg" style="flex:1">
        <button id="target-layer" class="on">图层</button>
        <button id="target-mask">蒙版</button>
      </div>
    </div>
  </section>

  <!-- ============== center: canvas ============== -->
  <section class="canvas-wrap">
    <div class="muted">在画布上拖动绘画；点击任意像素查看逐层颜色求值（右侧）。</div>
    <div class="canvas-box">
      <canvas id="canvas" width="32" height="32"></canvas>
      <div id="probe"></div>
    </div>
    <div class="row">
      <label class="muted">显示缩放</label>
      <input type="range" id="zoom" min="8" max="28" value="16">
    </div>
  </section>

  <!-- ============== right: evaluation ============== -->
  <section class="panel">
    <h2>颜色求值（实际运算）</h2>
    <div class="row"><span class="muted">像素：</span><span id="probe-pos">未选择</span></div>
    <div id="stages"></div>
    <h2>图层合成运行状态</h2>
    <div id="run-status" class="cost-box muted">尚未求值</div>
    <h2>重算日志（依赖驱动）</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<div id="error-strip"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let state = null, selectedUid = null, backend = "ref", paintingTarget = "layer";
let zoom = 16, drawing = false, lastPoint = null;

async function api(path, body) {
  const opt = body ? { method: "POST", headers: { "Content-Type": "application/json" },
                       body: JSON.stringify(body) } : {};
  const res = await fetch(path, opt);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) { showError(data.error || ("HTTP " + res.status)); throw new Error(data.error); }
  hideError();
  return data;
}
function showError(msg) { const el = $("error-strip"); el.textContent = "图层合成错误：" + msg; el.classList.add("show"); }
function hideError() { $("error-strip").classList.remove("show"); }

async function refreshState() {
  state = await api("/api/state");
  $("canvas-size").textContent = state.width + " × " + state.height;
  $("canvas").width = state.width; $("canvas").height = state.height;
  applyZoom();
  renderTree();
  renderBlendOptions();
  renderInspector();
}

function renderTree() {
  const root = $("tree"); root.innerHTML = "";
  const renderNode = (node, ul) => {
    const li = document.createElement("li");
    const div = document.createElement("div");
    div.className = "node" + (node.uid === selectedUid ? " selected" : "");
    const kind = document.createElement("span");
    kind.className = "kind"; kind.textContent = node.kind === "group" ? "组" : "层";
    div.appendChild(kind);
    const name = document.createElement("span"); name.textContent = node.name; div.appendChild(name);
    const flags = document.createElement("span"); flags.className = "flags";
    if (node.kind === "group") flags.textContent += (node.isolated ? "隔离 " : "穿透 ");
    if (node.clipped) flags.textContent += "裁切";
    if (node.mask_id) flags.textContent += " 蒙版";
    if (node.kind === "group" && node.empty) flags.textContent += " 空";
    div.appendChild(flags);
    div.onclick = () => { selectedUid = node.uid; renderTree(); renderInspector(); };
    li.appendChild(div);
    if (node.children && node.children.length) {
      const childUl = document.createElement("ul");
      node.children.forEach((c) => renderNode(c, childUl));
      li.appendChild(childUl);
    }
    ul.appendChild(li);
  };
  renderNode(state.root, root);
}

function renderBlendOptions() {
  const sel = $("f-blend");
  if (sel.options.length === state.blend_modes.length) return;
  sel.innerHTML = "";
  state.blend_modes.forEach((m) => {
    const o = document.createElement("option"); o.value = m; o.textContent = m; sel.appendChild(o);
  });
}

function findNode(uid, node) {
  node = node || state.root;
  if (node.uid === uid) return node;
  for (const c of node.children || []) {
    const hit = findNode(uid, c); if (hit) return hit;
  }
  return null;
}
function selectedNode() { return selectedUid == null ? null : findNode(selectedUid); }

function renderInspector() {
  const node = selectedNode();
  const disabled = !node;
  ["f-name", "f-opacity", "f-blend", "f-clip-on", "f-clip-off"].forEach((id) => $(id).disabled = disabled);
  if (!node) return;
  $("f-name").value = node.name;
  $("f-opacity").value = node.opacity; $("f-opacity-val").textContent = node.opacity.toFixed(2);
  $("f-blend").value = node.blend_mode;
  const isGroup = node.kind === "group";
  $("iso-row").style.display = isGroup ? "flex" : "none";
  if (isGroup) {
    $("f-iso-on").classList.toggle("on", node.isolated);
    $("f-iso-off").classList.toggle("on", !node.isolated);
    $("f-iso-on").disabled = $("f-iso-off").disabled = false;
  }
  $("f-clip-on").classList.toggle("on", node.clipped);
  $("f-clip-off").classList.toggle("on", !node.clipped);
}

function applyZoom() {
  const c = $("canvas");
  c.style.width = (state.width * zoom) + "px";
  c.style.height = (state.height * zoom) + "px";
  $("probe").style.width = zoom + "px"; $("probe").style.height = zoom + "px";
}

function putPng(base64) {
  const c = $("canvas"), ctx = c.getContext("2d");
  const img = new Image();
  img.onload = () => { ctx.clearRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0); };
  img.src = "data:image/png;base64," + base64;
}

async function evaluate() {
  const data = await api("/api/evaluate", { backend });
  putPng(data.png_base64);
  $("log").textContent = data.log.map((r) => r.join(" ")).join("\n");
  renderRunStatus(data);
  const box = $("stages"); box.innerHTML = "";
  data.stages.forEach((s) => {
    const div = document.createElement("div"); div.className = "stage";
    div.innerHTML = '<div class="name">' + s.name + ' <span class="meta">(' + s.kind + ")</span></div>" +
      '<div class="meta">' + s.blend_mode + " · op " + s.opacity.toFixed(2) +
      (s.kind === "group" ? " · " + (s.isolated ? "隔离" : "穿透") : "") +
      (s.clipped ? " · 裁切" : "") + "</div>";
    box.appendChild(div);
  });
  return data;
}

function renderRunStatus(data) {
  const el = $("run-status");
  if (!data.cost) { el.textContent = "后端未返回成本分解"; return; }
  const e = data.cost.events, b = data.cost.buffers;
  const peakKb = (b.peak_live_bytes / 1024).toFixed(1);
  const totalKb = (b.allocated_bytes / 1024).toFixed(1);
  // Surface reuse events and flag anything abnormal for pixel/color eval.
  const warnings = [];
  if (b.peak_live_bytes <= 0) warnings.push("缓冲峰值为 0（计量异常）");
  if (e.place + e.passthrough === 0) warnings.push("没有任何放置运算（结果可能为空）");
  const pills = [
    "放置 " + (e.place || 0), "穿透 " + (e.passthrough || 0),
    "内容命中 " + (e["cache-hit"] || 0), "冻结复用 " + (e["frozen-splice"] || 0),
    "矩形重算 " + (e["recompute-rect"] || 0), "蒙版 " + (e["mask-apply"] || 0),
    "跳过克隆 " + (e["clone-skipped"] || 0), "alpha复用 " + (e["alpha-hit"] || 0),
  ].map((t) => '<span class="pill">' + t + "</span>").join("");
  el.innerHTML =
    '<div>缓冲峰值 <b>' + peakKb + " KB</b> / 累计分配 " + totalKb +
    " KB · 分配次数 " + b.allocations + "</div>" +
    '<div style="margin-top:4px">' + pills + "</div>" +
    (warnings.length
      ? '<div class="warn" style="margin-top:5px">⚠ ' + warnings.join("；") + "</div>"
      : '<div class="ok" style="margin-top:5px">合成像素与颜色求值运行正常，无异常</div>');
}

async function showWhyRedraw() {
  const node = selectedNode();
  const box = $("why-box");
  box.style.display = "block";
  if (!node) { box.innerHTML = '<span class="muted">请先选择一个节点</span>'; return; }
  try {
    const data = await api("/api/why?uid=" + node.uid);
    if (!data.reasons.length) {
      box.innerHTML = '<div class="none">该节点缓存可复用：没有传播到它的编辑。</div>';
      return;
    }
    box.innerHTML = "<b>" + data.name + "</b> 为何重画：" +
      data.reasons.map((r) =>
        '<div class="reason"><div class="cause">' + r.cause + "</div>" +
        (r.boundary ? '<div class="muted">缓存边界：' + r.boundary + "</div>" : "") +
        '<div class="path">传播链：' + (r.path || []).join(" → ") + "</div>" +
        '<div class="muted">脏矩形：' + JSON.stringify(r.rect) + "</div></div>").join("");
  } catch (e) { box.innerHTML = '<span class="warn">反查失败：' + e.message + "</span>"; }
}

async function probePixel(x, y) {
  const data = await api("/api/pixel?" + new URLSearchParams({ x, y }));
  $("probe-pos").textContent = "(" + x + ", " + y + ")";
  const box = $("stages"); box.innerHTML = "";
  data.stages.forEach((s) => {
    const [r, g, b, a] = s.rgba_bytes;
    const div = document.createElement("div"); div.className = "stage";
    div.innerHTML =
      '<div class="name"><span class="chip" style="background:rgba(' + r + "," + g + "," + b + "," + (a / 255) + ')"></span>' +
      s.name + ' <span class="meta">(' + s.kind + ")</span></div>" +
      '<div class="meta">' + s.blend_mode + " · op " + s.opacity.toFixed(2) +
      (s.kind === "group" ? " · " + (s.isolated ? "隔离" : "穿透") : "") +
      (s.clipped ? " · 裁切" : "") + "</div>" +
      '<div class="meta">bytes ' + s.rgba_bytes.join(", ") + "<br>unit " +
      s.rgba_unit.map((v) => v.toFixed(3)).join(", ") + "</div>";
    box.appendChild(div);
  });
  const pr = $("probe");
  pr.style.left = (x * zoom) + "px"; pr.style.top = (y * zoom) + "px";
}

// ------------------------------------------------------------- painting
function eventPos(ev) {
  const rect = $("canvas").getBoundingClientRect();
  return { x: Math.floor((ev.clientX - rect.left) / zoom),
           y: Math.floor((ev.clientY - rect.top) / zoom) };
}
function brushColor() {
  const hex = $("brush-color").value;
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16),
          parseInt(hex.slice(5, 7), 16), parseInt($("brush-alpha").value, 10)];
}
$("canvas").addEventListener("pointerdown", async (ev) => {
  const node = selectedNode();
  if (!node) return showError("请先在左侧选择要绘画的图层");
  if (paintingTarget === "layer" && node.kind !== "layer")
    return showError("图层绘画目标必须是图层，不能直接画在组上");
  drawing = true; const p = eventPos(ev); lastPoint = p;
  await sendStroke([p], node);
});
$("canvas").addEventListener("pointermove", async (ev) => {
  if (!drawing) return;
  const p = eventPos(ev);
  if (p.x === lastPoint.x && p.y === lastPoint.y) return;
  const node = selectedNode();
  await sendStroke([lastPoint, p], node); lastPoint = p;
});
window.addEventListener("pointerup", async () => {
  if (!drawing) return;
  drawing = false;
  await evaluate();
});
async function sendStroke(points, node) {
  const common = { points, color: brushColor(),
    radius: parseFloat($("brush-radius").value),
    hardness: parseFloat($("brush-hardness").value) };
  try {
    if (paintingTarget === "layer") {
      await api("/api/stroke", Object.assign({ uid: node.uid }, common));
    } else {
      if (!node.mask_id) return showError("该节点没有蒙版，请先在工程中分配蒙版");
      await api("/api/mask", Object.assign({ mask_id: node.mask_id }, common));
    }
  } catch (e) { drawing = false; }
}

// ------------------------------------------------------------- controls
$("f-opacity").oninput = async () => {
  const node = selectedNode(); if (!node) return;
  $("f-opacity-val").textContent = parseFloat($("f-opacity").value).toFixed(2);
  await api("/api/node", { uid: node.uid, opacity: parseFloat($("f-opacity").value) });
  await evaluate();
};
$("f-blend").onchange = async () => {
  const node = selectedNode();
  await api("/api/node", { uid: node.uid, blend_mode: $("f-blend").value });
  node.blend_mode = $("f-blend").value; renderTree(); await evaluate();
};
$("f-name").onchange = async () => {
  const node = selectedNode();
  await api("/api/node", { uid: node.uid, name: $("f-name").value });
  await refreshState();
};
$("f-clip-on").onclick = async () => { await setFlag("clipped", true); };
$("f-clip-off").onclick = async () => { await setFlag("clipped", false); };
$("f-iso-on").onclick = async () => { await setFlag("isolated", true); };
$("f-iso-off").onclick = async () => { await setFlag("isolated", false); };
async function setFlag(key, value) {
  const node = selectedNode(); if (!node) return;
  try {
    await api("/api/node", { uid: node.uid, [key]: value });
    await refreshState(); await evaluate();
  } catch (e) { await refreshState(); }
}
$("btn-add-layer").onclick = async () => {
  const parent = selectedNode() && selectedNode().kind === "group" ? selectedNode() : state.root;
  const data = await api("/api/layers", { action: "add-layer", parent_uid: parent.uid });
  selectedUid = data.uid; await refreshState(); await evaluate();
};
$("btn-add-group").onclick = async () => {
  const parent = selectedNode() && selectedNode().kind === "group" ? selectedNode() : state.root;
  const data = await api("/api/layers", { action: "add-group", parent_uid: parent.uid });
  selectedUid = data.uid; await refreshState();
};
$("btn-delete").onclick = async () => {
  const node = selectedNode(); if (!node) return;
  await api("/api/layers", { action: "delete", uid: node.uid });
  selectedUid = null; await refreshState(); await evaluate();
};
$("target-layer").onclick = () => { paintingTarget = "layer"; $("target-layer").classList.add("on"); $("target-mask").classList.remove("on"); };
$("target-mask").onclick = () => { paintingTarget = "mask"; $("target-mask").classList.add("on"); $("target-layer").classList.remove("on"); };
$("brush-alpha").oninput = () => $("brush-alpha-val").textContent = $("brush-alpha").value;
$("brush-radius").oninput = () => $("brush-radius-val").textContent = $("brush-radius").value;
$("brush-hardness").oninput = () => $("brush-hardness-val").textContent = $("brush-hardness").value;
$("zoom").oninput = () => { zoom = parseInt($("zoom").value); applyZoom(); };
$("canvas").addEventListener("click", (ev) => { const p = eventPos(ev); probePixel(p.x, p.y); });
$("btn-eval").onclick = evaluate;
$("btn-why").onclick = showWhyRedraw;
$("backend-seg").onclick = async (ev) => {
  if (ev.target.dataset.backend) {
    backend = ev.target.dataset.backend;
    document.querySelectorAll("#backend-seg button").forEach((b) =>
      b.classList.toggle("on", b.dataset.backend === backend));
    await api("/api/backend", { backend }); await evaluate();
  }
};
$("btn-export").onclick = () => {
  // Export goes through the same evaluator endpoint, then saves client side.
  api("/api/evaluate", { backend }).then((d) => {
    const a = document.createElement("a");
    a.href = "data:image/png;base64," + d.png_base64; a.download = "composite.png"; a.click();
  });
};
$("btn-save").onclick = async () => {
  const d = await api("/api/save");
  const blob = new Blob([JSON.stringify(d.project, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "project.lp.json"; a.click();
};
$("btn-reset").onclick = async () => { await api("/api/reset", {}); await refreshState(); await evaluate(); };

(async function init() {
  $("brush-alpha-val").textContent = $("brush-alpha").value;
  $("brush-radius-val").textContent = $("brush-radius").value;
  $("brush-hardness-val").textContent = $("brush-hardness").value;
  await refreshState();
  selectedUid = state.root.uid; renderTree(); renderInspector();
  await evaluate();
})();
</script>
</body>
</html>
